name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax
        run: python -m py_compile $(git ls-files '*.py')
      - name: Offline tests
        run: python -m unittest discover -s tests -v
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [tests, hacs, hassfest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Create versioned release and manual installer archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("custom_components/parkrun5k/manifest.json"))["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('parkrun_from_imap.zip', 'w', ZIP_DEFLATED) as archive:
              for path in Path('custom_components/parkrun5k').rglob('*'):
                  if path.is_file() and '__pycache__' not in path.parts and path.suffix != '.pyc':
                      archive.write(path)
              for name in ('README.md', 'LICENSE', 'RELEASE_NOTES.md'):
                  archive.write(name)
          PY
          gh release create "$tag" parkrun_from_imap.zip --target "$GITHUB_SHA" \
            --title "Parkrun from IMAP $version" --notes-file RELEASE_NOTES.md
